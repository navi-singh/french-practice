<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12372a">
    <meta
      name="description"
      content="Mobile-friendly French lessons, exercises, answers, and review plans."
    >
    <title>French Practice</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="menu-button" class="icon-button" aria-label="Open chapters">☰</button>
        <a class="brand" href="#/">
          <span class="brand-mark">FR</span>
          <span>
            <strong>French Practice</strong>
            <small>Learn · write · speak · review</small>
          </span>
        </a>
        <div class="topbar-actions">
          <button id="theme-button" class="icon-button" aria-label="Toggle dark mode">◐</button>
        </div>
      </header>

      <aside id="sidebar" class="sidebar" aria-label="Course navigation">
        <div class="search-wrap">
          <label for="search">Search the course</label>
          <input id="search" type="search" placeholder="e.g. adjective, passé composé">
        </div>
        <div id="progress-summary" class="progress-summary"></div>
        <div class="search-wrap voice-wrap">
          <label for="voice-select">French voice</label>
          <select id="voice-select"></select>
          <p id="voice-hint" class="voice-hint"></p>
        </div>
        <div class="search-wrap voice-wrap">
          <label for="speed-range">Speaking speed — <span id="speed-value">88%</span></label>
          <input id="speed-range" class="speed-range" type="range" min="20" max="100" step="5" value="88" />
          <p class="voice-hint">100% is normal French speed; 50% is half speed. Slow it down to hear every syllable, then build back up.</p>
        </div>
        <nav id="chapter-list"></nav>
      </aside>

      <main id="main" class="main-content" tabindex="-1">
        <noscript>This site requires JavaScript for course navigation.</noscript>
      </main>
    </div>

    <div class="speak-bar">
      <button id="speak-slow" class="speak-button speak-button-secondary" type="button" title="Pronounce the selection at half speed">
        <span>🐢</span> Slower
      </button>
      <button id="speak-selection" class="speak-button" type="button">
        <span>🔊</span> Pronounce selection
      </button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="backdrop" class="backdrop"></div>

    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
